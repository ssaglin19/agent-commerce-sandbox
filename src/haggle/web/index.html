<!doctype html><meta charset=utf-8><title>Haggle Court</title>
<style>body{font:16px system-ui;max-width:780px;margin:2rem auto;padding:0 1rem;background:#1b1410;color:#f3e6d3}
.t{padding:.5rem .8rem;margin:.4rem 0;border-radius:8px;background:#2c211a}.b{border-left:4px solid #d9a441}.s{border-left:4px solid #c0563a}
.j{border-left:4px solid #8c6bd9}.c{border-left:4px solid #5aa37a}.e{border-left:4px solid #f33;color:#f99}
button{padding:.6rem 1.2rem;font-size:1rem;margin-right:.5rem}h1{color:#d9a441}.p{color:#9ad}code{color:#9ad}</style>
<h1>Haggle Court</h1><p>Statler haggles, Waldorf heckles, PayPal holds the money, the judge decides.</p>
<button onclick="go('happy')">Open court</button><button onclick="go('void')">Group bails out</button><span id=m></span><div id=o></div>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),o=document.getElementById('o');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const add=(h,c)=>{o.insertAdjacentHTML('beforeend',`<div class="t ${c||''}">${h}</div>`)};
async function go(sc){o.innerHTML='';m.textContent=' running...';
 const r=await (await fetch('/api/run?scenario='+sc,{method:'POST'})).json();
 m.textContent=' PayPal mode: '+r.mode;
 for(const t of r.turns){add(`<b>${esc(t.who)}</b>: ${esc(t.text)}`,t.who[0]=='S'?'b':'s');await sleep(600)}
 if(r.agreed==null){add('No deal.');return}
 add(`<b>Agreed: $${r.agreed.toFixed(2)}</b>`);await sleep(500);
 add(`<span class=p>${esc(r.steps[0]||'')}</span>`+(r.ids.authorization?`<br>auth <code>${esc(r.ids.authorization)}</code>`:''));await sleep(500);
 add('<b>Group chat</b><br>'+r.chat.map(c=>`${esc(c.who)}: ${esc(c.text)}`).join('<br>'));await sleep(800);
 if(r.ruling){add(`<b>Judge:</b> ${esc(r.ruling.verdict)} <b>[${r.ruling.decision}]</b><br>`+Object.entries(r.ruling.shares).map(([k,v])=>`${esc(k)}: $${v.toFixed(2)}`).join(' &middot; '),'j')}
 for(const s of r.steps.slice(1)){await sleep(500);add(`<span class=p>${esc(s)}</span>`,'c')}
 if(r.ids.capture)add(`capture <code>${esc(r.ids.capture)}</code>`,'c');
 if(r.error)add('Error: '+esc(r.error),'e')}
</script>
