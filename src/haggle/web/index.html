<!doctype html><meta charset=utf-8><title>Haggle Court</title>
<style>:root{--navy:#001c64;--blue:#003087;--bright:#0070e0;--gold:#ffd140}
body{font:16px system-ui;max-width:780px;margin:2rem auto;padding:0 1rem;background:var(--navy);color:#fff}
.t{padding:.5rem .8rem;margin:.4rem 0;border-radius:8px;background:var(--blue)}.b{border-left:4px solid var(--gold)}.s{border-left:4px solid var(--bright)}
.j{border-left:4px solid #fff}.c{border-left:4px solid #5fd08a}.e{border-left:4px solid #ff6b6b;color:#ffd0d0}
button{padding:.6rem 1.2rem;font-size:1rem;margin-right:.5rem;background:var(--bright);color:#fff;border:0;border-radius:6px}button:disabled{opacity:.5}h1{color:#fff}.p{color:#cfe3ff}code{color:var(--gold)}a{color:var(--gold)}</style>
<h1>Haggle Court</h1><p id=mode>Sandbox or mock demonstration only. No real money. Bot banter is scripted unless an approved model is configured.</p><p>Statler haggles, Waldorf heckles, PayPal holds the money, the judge decides.</p>
<button onclick="go('happy')">Open court</button><button onclick="go('void')">Group bails out</button><a href="/pool" style="margin-left:12px">Next: settle the group split in Pool</a><span id=m></span><div id=o></div>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),o=document.getElementById('o');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const add=(h,c)=>{o.insertAdjacentHTML('beforeend',`<div class="t ${c||''}">${h}</div>`)};
async function go(sc){o.innerHTML='';m.textContent=' running...';
 const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
 try {
 const response=await fetch('/api/run?scenario='+sc,{method:'POST'});
 if(!response.ok){let msg='Server returned '+response.status;try{msg=(await response.json()).error||msg}catch{}throw new Error(msg)}
 const r=await response.json();if(r.error&&!r.turns)throw new Error(r.error);
 m.textContent=' PayPal mode: '+r.mode;
 for(const t of r.turns){add(`<b>${esc(t.who)}</b>: ${esc(t.text)}`,t.who[0]=='S'?'b':'s');await sleep(600)}
 if(r.agreed==null){add('No deal.');return}
 add(`<b>Agreed: $${r.agreed.toFixed(2)}</b>`);await sleep(500);
 add(`<span class=p>${esc(r.steps[0]||'')}</span>`+(r.ids.authorization?`<br>auth <code>${esc(r.ids.authorization)}</code>`:''));await sleep(500);
 add('<b>Group chat</b><br>'+r.chat.map(c=>`${esc(c.who)}: ${esc(c.text)}`).join('<br>'));await sleep(800);
 if(r.ruling){add(`<b>Judge:</b> ${esc(r.ruling.verdict)} <b>[${r.ruling.decision}]</b><br>`+Object.entries(r.ruling.shares).map(([k,v])=>`${esc(k)}: $${v.toFixed(2)}`).join(' &middot; '),'j')}
 for(const s of r.steps.slice(1)){await sleep(500);add(`<span class=p>${esc(s)}</span>`,'c')}
 if(r.ids.capture)add(`capture <code>${esc(r.ids.capture)}</code>`,'c');
 if(r.payouts?.length)add('Payout requests: '+r.payouts.map(p=>p.batch?('batch '+esc(p.batch)):(esc(p.to)+' $'+Number(p.amount).toFixed(2)+' '+esc(p.status))).join(', ')+' (delivery not confirmed)','c');
 if(r.error)add('Error: '+esc(r.error),'e');
 }catch(e){m.textContent=' Run failed';add(esc(e.message)+'. No automatic retry.','e')}finally{buttons.forEach(b=>b.disabled=false)}}
</script>
