services:
  - type: web
    name: haggle-court
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: "true"
    startCommand: PYTHONPATH=src python3 -m haggle.server
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
